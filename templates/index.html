<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok video downloader</title>
  <meta name="description" content="Paste a TikTok link and save the video as an MP4.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14172b;
      --paper: #eef1f8;
      --card: #ffffff;
      --line: #cdd3e4;
      --muted: #555b78;
      --pink: #e0194f;
      --pink-dark: #b8123f;
      --teal: #0a8f8c;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 20px 48px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 46ch;
    }
    form {
      display: flex;
      gap: 10px;
    }
    input[type="url"] {
      flex: 1;
      min-width: 0;
      padding: 16px 18px;
      font: inherit;
      color: var(--ink);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 14px;
    }
    input[type="url"]::placeholder { color: #8b91ab; }
    button, .btn {
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--pink);
      border: 0;
      border-radius: 14px;
      padding: 16px 24px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    button:hover, .btn:hover { background: var(--pink-dark); }
    button:disabled { opacity: .6; cursor: progress; }
    input:focus-visible, button:focus-visible, .btn:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 2px;
    }
    .status {
      min-height: 1.5em;
      margin: 14px 2px 0;
      color: var(--muted);
    }
    .status.error { color: var(--error); font-weight: 600; }

    .result {
      display: flex;
      gap: 18px;
      margin-top: 20px;
      padding: 16px;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 18px;
    }
    .result[hidden] { display: none; }
    .thumb {
      flex: 0 0 110px;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 10px;
      background: var(--line);
    }
    .meta { display: flex; flex-direction: column; min-width: 0; }
    .meta h2 {
      margin: 0 0 4px;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .meta p { margin: 0; color: var(--muted); font-size: .95rem; }
    .meta .btn { margin-top: auto; align-self: flex-start; }

    .note {
      margin-top: 56px;
      color: var(--muted);
      font-size: .9rem;
      max-width: 60ch;
    }

    @media (max-width: 520px) {
      main { padding-top: 40px; }
      form { flex-direction: column; }
      .meta .btn { margin-top: 14px; align-self: stretch; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #eef1f8;
        --paper: #12142a;
        --card: #1b1e3a;
        --line: #343963;
        --muted: #a6acc9;
        --teal: #3ad6d2;
        --error: #ff8a80;
      }
      input[type="url"]::placeholder { color: #7b82a6; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Paste a TikTok link. Save the video.</h1>
    <p class="lede">Copy the link from the Share menu in TikTok, paste it below, and download the video as an MP4.</p>

    <form id="form">
      <input id="url" type="url" inputmode="url" autocomplete="off" required
             placeholder="https://www.tiktok.com/@user/video/..." aria-label="TikTok link">
      <button id="go" type="submit">Get video</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" class="result" hidden>
      <img id="thumb" class="thumb" alt="" referrerpolicy="no-referrer">
      <div class="meta">
        <h2 id="title"></h2>
        <p id="info"></p>
        <a id="dl" class="btn" href="#" download>Download MP4</a>
      </div>
    </section>

    <p class="note">Only download videos you made or have permission to save. Respect the creator's rights and TikTok's terms.</p>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const go = document.getElementById('go');
    const statusEl = document.getElementById('status');
    const result = document.getElementById('result');

    function fmt(seconds) {
      if (!seconds) return '';
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (!url) return;

      go.disabled = true;
      result.hidden = true;
      setStatus('Looking up your video...');

      try {
        const res = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');

        document.getElementById('thumb').src = data.thumbnail || '';
        document.getElementById('title').textContent = data.title;
        const bits = [data.uploader, fmt(data.duration)].filter(Boolean);
        document.getElementById('info').textContent = bits.join(', ');
        document.getElementById('dl').href = data.download;
        result.hidden = false;
        setStatus('');
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        go.disabled = false;
      }
    });
  </script>
</body>
        </html>
